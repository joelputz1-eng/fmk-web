<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="FMK">
  <!--
    Quelle für alle App-Icons. Bildsprache wie in der App: tiefe Pflaumen-Tinte
    als Grund, darauf die Versalien und die dreifarbige Leiste (heiß, kostbar,
    kalt), die in der App überall dort steht, wo sonst eine Trennlinie wäre.

    Die Schrift läuft bewusst über generische Familien statt über die Webfont —
    ein Icon darf nicht davon abhängen, ob Anton geladen ist.

    Die maskable Variante entsteht daraus beim Rendern: dieselbe Zeichnung
    kleiner, mit Rand aufgefüllt, damit beim Zuschnitt auf einen Kreis nichts
    Wichtiges verlorengeht.
  -->
  <defs>
    <clipPath id="bar">
      <rect x="106" y="330" width="300" height="26" rx="13"/>
    </clipPath>
  </defs>

  <rect width="512" height="512" fill="#140e1c"/>

  <text x="256" y="292"
        font-family="Impact, 'Haettenschweiler', 'Arial Narrow Bold', sans-serif"
        font-size="186" font-weight="400" letter-spacing="2"
        text-anchor="middle" fill="#f3ebe5">FMK</text>

  <!-- Drei gleich breite Felder, außen rund beschnitten statt einzeln gerundet. -->
  <g clip-path="url(#bar)">
    <rect x="106" y="330" width="100" height="26" fill="#ff3a6c"/>
    <rect x="206" y="330" width="100" height="26" fill="#ffc44c"/>
    <rect x="306" y="330" width="100" height="26" fill="#6cd4e8"/>
  </g>
</svg>
